[build-system]
requires = ["hatchling>=1.29.0", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "src_method"
authors = [
  { name = "Algorithmiq Development Team", email = "aurora@algorithmiq.fi" },
]
description = "Successive Randomized Compression."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["array-api-compat>=1.12", "numpy>=2.0,<3", "opt_einsum>=3.4.0"]


[project.optional-dependencies]
# The ctk extra pulls the CUDA 13 libraries from NVIDIA's cuda-toolkit wheels.
gpu-nvidia = ["cupy-cuda13x[ctk]>=14"]
gpu-rocm = ["cupy>=14.1.1"]


[project.urls]
Homepage = "https://algorithmiq.fi"
Documentation = "https://algorithmiq.github.io/src-method/"
Repository = "https://github.com/Algorithmiq/src-method"
Changelog = "https://github.com/Algorithmiq/src-method/releases"
"Bug Tracker" = "https://github.com/Algorithmiq/src-method/issues"
Discussions = "https://github.com/Algorithmiq/src-method/discussions"


[dependency-groups]
test = [
  "pytest-cov>=4.0",
  "pytest>=9.1.0,<10.0",
  "pytest-benchmark>=5.2.3",
  "quimb>=1.8.3,<2",
  # Not imported directly: without it, cotengra (via quimb) warns when it plans a
  # contraction, which `filterwarnings = ["error"]` turns into a failure.
  "cmaes>=0.12.0",
]
# Only the scripts under benches/ need these.
bench = ["cyclopts>=3.20", "quimb>=1.8.3,<2", "cmaes>=0.12.0", "scipy>=1.13"]
dev = [
  "scalene>=1.5",
  "prek>=0.2.6",
  "ruff==0.17.3",
  "ty==0.0.82",
  { include-group = "test" },
  { include-group = "bench" },
]
interactive = [
  "ipykernel>=7.2.0",
  "matplotlib>=3.11.0",
  "pydot>=1.4",
  "tqdm>=4.65.0",
  "pylatexenc>=2.10",
]
docs = [
  # Builds the Fumadocs site under docs/; see docs/README.md.
  "griffelib>=2.2,<3",
  "nbconvert>=7",
  "pytest-markdown-docs>=0.9",
  { include-group = "test" },
  { include-group = "interactive" },
]


[tool.uv]
python-preference = "only-managed"


[tool.hatch]
version = { source = "vcs" }
metadata = { allow-direct-references = true }
build.hooks.vcs = { version-file = "src/src_method/_version.py" }


[tool.pytest.ini_options]
minversion = "8.0"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(message)s"
addopts = [
  "--import-mode=importlib",
  "-ra",
  "--showlocals",
  "--strict-markers",
  "--strict-config",
]
pythonpath = ["."]
filterwarnings = ["error"]
markers = [
  "slow: mark test as slow (>=1 minute runtime)",
  "perf: mark test as benchmark",
]
testpaths = ["tests"]
required_plugins = ["pytest-cov"]


[tool.coverage]
run.source = ["src/src_method"]
relative_files = true
omit = ["src/src_method/_version.py"]

[tool.coverage.report]
exclude_also = [
  '\.\.\.',
  "def __repr__",
  "if self.debug:",
  "if settings.DEBUG:",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "class .*\\bProtocol\\):",
  "@(abc\\.)?abstractmethod",
  "if (typing\\.)?TYPE_CHECKING:",
  '^\s*\.\.\.',
  "logger =",
  "logger\\.",
  "return NotImplemented",
  "@overload",
]


[tool.ruff]
# for the default settings, see: https://docs.astral.sh/ruff/configuration/#configuring-ruff

exclude = ["docs", "src/src_method/_version.py"]

# Lint against the oldest supported interpreter, not the default one.
target-version = "py311"

[tool.ruff.format]
# enable auto-formatting of code examples in docstrings
docstring-code-format = true

# set the line length limit used when formatting code snippets in
# docstrings
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
extend-select = [
  "A",      # flake8-builtins
  "ANN",    # flake8-annotations
  "ARG",    # flake8-unused-arguments
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "C90",    # mccabe
  "D",      # pydocstyle
  "E",
  "W",      # pycodestyle
  "EM",     # flake8-errmsg
  "ERA",    # eradicate
  "EXE",    # flake8-executable
  "FBT",    # flake8-boolean-trap
  "FLY",    # flynt
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "I",      # isort
  "ICN",    # flake8-import-conventions
  "INP",    # flake8-no-pep420
  "ISC003", # flake8-implicit-str-concat: explicit-string-concatenation (other rules conflict with the formatter)
  "N",      # pep8-naming
  "NPY",    # NumPy-specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PIE",    # flake8-pie
  "PL",     # pylint
  "PLC",    # pylint convention
  "PLE",    # pylint error
  "PLR",    # pylint refactor
  "PLW",    # pylint warning
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific rules
  "S",      # flake8-bandit
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slot
  "T20",    # flake8-print
  "TCH",    # flake8-type-checking
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "YTT",    # flake8-2020
  "TRY",    # tryceratops
]

ignore = [
  "D206",    # indent-with-spaces: enforced by the formatter
  "E111",    # indentation-with-invalid-multiple: enforced by the formatter
  "E114",    # indentation-with-invalid-multiple-ment: enforced by the formatter
  "E117",    # over-indented: enforced by the formatter
  "N803",    # pep8-naming: "argument name should be lowercase"
  "N806",    # pep8-naming: "variable in function should be lowercase"
  "PLR0913", # pylint refactor: "too many arguments to function call"
  "PLR0915", # pylint refactor: "too many statements"
  "PLR2004", # pylint refactor: "magic value used in comparison"
  "W191",    # tab-indentation: enforced by the formatter
]

# do not attempt autofix with `--fix` for the following rules
unfixable = [
  "ERA",  # removes commented-out code
  "F401", # removes unused imports
  "F841", # removes unused variables
  "T20",  # removes print statements
]

# allow unused variadic arguments, like *args and **kwargs.
flake8-unused-arguments.ignore-variadic-names = true
flake8-annotations.allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
# ignore for contents of `tests`:
# - S101 (flake8-bandit `AssertUsed`),
# - D (pydocstyle)
# - C901 (mccabe)
# - INP001 (flake8-no-pep420)
# - E721 (type-comparison)
"tests/*" = ["S101", "D", "C901", "INP001", "E721"]
# ignore for all `test_*.py` files
# - ANN (flake8-annotations)
# - I002 (isort required import)
"tests/**/test_*.py" = ["ANN", "I002"]
# ignore I002 (isort required import) for all `__init__.py` files
"src/src_method/**/__init__.py" = ["I002"]

[tool.ruff.lint.pycodestyle]
# maximum line length to allow for line-length violations within documentation,
# including standalone comments
max-doc-length = 140
max-line-length = 120

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]


[tool.ty.environment]
python-version = "3.11"

[tool.ty.analysis]
# Optional GPU dependency, imported lazily in `utils._backend`.
allowed-unresolved-imports = ["cupy", "cupyx", "cupyx.**"]

[tool.ty.src]
include = ["src/src_method", "tests"]
